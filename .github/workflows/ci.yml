# P15-8: test-only CI. No deployment, no secrets, no artefacts beyond the coverage report
# (section 0.2 removed deployment from scope).
#
# What CI cannot see: LAV-DF, the trained weights (*.pt is not in git) and a GPU. Every test
# that needs them skips itself; the e2e and regression tests run on committed fixtures with a
# platform-independent seeded model instead (tests/regression.py). Coverage is gated at 70% on
# src/ (pyproject.toml, [tool.coverage.report]).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python — lint, tests, coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      HYPOTHESIS_PROFILE: ci  # derandomized: a failure here reproduces locally
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: System packages (ffmpeg for audio/video, GL for OpenCV/MediaPipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libgl1 libglib2.0-0

      # requirements.txt is the pinned Windows/CUDA environment. Torch comes from the CPU
      # index here; everything else is held to the same pins as constraints.
      - name: Constraints from requirements.txt (minus the CUDA torch builds)
        run: |
          sed '1s/^\xEF\xBB\xBF//' requirements.txt \
            | grep -vE '^(torch|torchvision|torchaudio)==|^--' > "$RUNNER_TEMP/constraints.txt"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.7.1 torchvision==0.22.1 torchaudio==2.7.1 \
            --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" -c "$RUNNER_TEMP/constraints.txt"

      - name: Fetch MediaPipe models (hash-pinned)
        run: python scripts/08_fetch_models.py

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy src api

      # Job logs need admin rights to read through the API; annotations are public. Every
      # FAILED/ERROR line and the coverage verdict are re-emitted as annotations so a failure
      # can be diagnosed from the run page or the checks API without a token.
      - name: Tests with coverage (fails under 70% on src/)
        run: |
          set -o pipefail
          pytest -q -rfE --cov=src --cov-report=term-missing:skip-covered --cov-report=xml             2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Surface failures as annotations
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " "$RUNNER_TEMP/pytest.log" | head -40             | while IFS= read -r line; do echo "::error title=pytest::${line}"; done
          grep -E "^E  +" "$RUNNER_TEMP/pytest.log" | head -40             | while IFS= read -r line; do echo "::error title=assertion::${line}"; done
          grep -E "Required test coverage|TOTAL|passed|failed" "$RUNNER_TEMP/pytest.log" | tail -4             | while IFS= read -r line; do echo "::notice title=summary::${line}"; done

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend — tests, typecheck, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run check-paths
      - run: npm test
      - run: npm run build
